<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2118"/>
      <stop offset="100%" stop-color="#242E21"/>
    </linearGradient>
    <linearGradient id="nodeActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3828"/>
      <stop offset="100%" stop-color="#1E261B"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="200" rx="16" fill="url(#bgGrad)"/>
  <rect width="398" height="198" x="1" y="1" rx="15" fill="none" stroke="rgba(240,240,232,0.12)" stroke-width="1"/>

  <!-- Subtle Geometric Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <circle cx="200" cy="95" r="70" fill="none"/>
    <line x1="20" y1="95" x2="380" y2="95"/>
  </g>

  <!-- Flow Track Line -->
  <path d="M 80 95 L 320 95" stroke="#A6AF99" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Phase 1: Understand -->
  <g transform="translate(30, 48)">
    <rect width="98" height="94" rx="12" fill="url(#nodeActive)" stroke="rgba(166,175,153,0.4)" stroke-width="1"/>
    <circle cx="49" cy="24" r="14" fill="rgba(166,175,153,0.15)"/>
    <text x="49" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#DCE4D0" text-anchor="middle">01</text>
    <text x="49" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F0F0E8" text-anchor="middle">UNDERSTAND</text>
    <text x="49" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#A6AF99" text-anchor="middle">Root Problem</text>
    <text x="49" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#A6AF99" text-anchor="middle">Constraints</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(133, 90)">
    <circle cx="8" cy="5" r="8" fill="rgba(212,178,130,0.15)"/>
    <polygon points="5,1 12,5 5,9" fill="#D4B282"/>
  </g>

  <!-- Phase 2: Build -->
  <g transform="translate(151, 48)">
    <rect width="98" height="94" rx="12" fill="url(#nodeActive)" stroke="rgba(212,178,130,0.5)" stroke-width="1.2"/>
    <circle cx="49" cy="24" r="14" fill="rgba(212,178,130,0.2)"/>
    <text x="49" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D4B282" text-anchor="middle">02</text>
    <text x="49" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F0F0E8" text-anchor="middle">BUILD</text>
    <text x="49" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#A6AF99" text-anchor="middle">Modular Systems</text>
    <text x="49" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#A6AF99" text-anchor="middle">Typed Contracts</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(254, 90)">
    <circle cx="8" cy="5" r="8" fill="rgba(166,175,153,0.15)"/>
    <polygon points="5,1 12,5 5,9" fill="#A6AF99"/>
  </g>

  <!-- Phase 3: Validate -->
  <g transform="translate(272, 48)">
    <rect width="98" height="94" rx="12" fill="url(#nodeActive)" stroke="rgba(166,175,153,0.4)" stroke-width="1"/>
    <circle cx="49" cy="24" r="14" fill="rgba(166,175,153,0.15)"/>
    <text x="49" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#DCE4D0" text-anchor="middle">03</text>
    <text x="49" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F0F0E8" text-anchor="middle">VALIDATE</text>
    <text x="49" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#A6AF99" text-anchor="middle">Automated Tests</text>
    <text x="49" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#A6AF99" text-anchor="middle">Observable Metrics</text>
  </g>

  <!-- Feedback Verification Loop -->
  <path d="M 321 146 C 321 168, 79 168, 79 146" fill="none" stroke="rgba(166,175,153,0.3)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="79,144 76,150 82,150" fill="#A6AF99"/>
  <rect x="160" y="160" width="80" height="15" rx="4" fill="#1A2118"/>
  <text x="200" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#A6AF99" text-anchor="middle">Continuous Feedback Loop</text>
</svg>
